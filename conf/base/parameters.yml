features:
  - sepal_length
  - sepal_width
  - petal_length
  - petal_width
target: species

split:
  test_size: 0.2
  random_state: 42

model:
  n_estimators: 100
  max_depth: 3
  random_state: 42

# Each prediction row records this value. The SageMaker inference pipeline
# replaces it with the registry version (kedro run --params model_version=N).
model_version: local
