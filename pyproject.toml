[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "iris-demo"
version = "0.1.0"
description = "Kedro iris pipeline run on SageMaker Pipelines with a champion/challenger model registry flow"
requires-python = ">=3.9"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = "requirements.txt" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.kedro]
package_name = "iris_demo"
project_name = "iris-demo"
kedro_init_version = "1.0.0"
source_dir = "src"
